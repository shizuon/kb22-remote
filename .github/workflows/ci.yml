name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression tests (fake hardware only)
        run: python -m unittest discover -s tests -v
      - name: JavaScript queue tests
        run: node --test tests/test_write_queue.cjs
      - name: Syntax checks
        run: |
          python -m compileall -q .
          node --check app.js
          node --check panel_layout.js
          node --check write_queue.js
